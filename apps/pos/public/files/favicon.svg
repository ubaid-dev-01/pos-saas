<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D3B39"/>
      <stop offset="100%" stop-color="#1A5E5A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A735"/>
      <stop offset="100%" stop-color="#F0BC5E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="128" y1="0" x2="128" y2="512" stroke="white" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="white" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="white" stroke-width="1"/>
    <line x1="0" y1="128" x2="512" y2="128" stroke="white" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="white" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- POS Terminal Shape -->
  <!-- Main body -->
  <rect x="120" y="80" width="272" height="240" rx="24" fill="rgba(255,255,255,0.12)"/>
  
  <!-- Screen -->
  <rect x="145" y="105" width="222" height="155" rx="12" fill="rgba(255,255,255,0.95)"/>
  
  <!-- Chart bars on screen -->
  <rect x="175" y="200" width="28" height="40" rx="4" fill="#2A9D8F" opacity="0.7"/>
  <rect x="215" y="175" width="28" height="65" rx="4" fill="#E8A735"/>
  <rect x="255" y="150" width="28" height="90" rx="4" fill="#0D3B39"/>
  <rect x="295" y="185" width="28" height="55" rx="4" fill="#2A9D8F"/>
  
  <!-- Chart trend line -->
  <polyline points="189,195 229,170 269,145 309,180" fill="none" stroke="#E8A735" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  
  <!-- Dollar/currency indicator on screen -->
  <text x="175" y="135" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#0D3B39" opacity="0.6">₹ Dashboard</text>
  
  <!-- Card slot -->
  <rect x="185" y="275" width="142" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Base/Stand -->
  <rect x="195" y="330" width="122" height="30" rx="8" fill="rgba(255,255,255,0.1)"/>
  <rect x="215" y="360" width="82" height="12" rx="6" fill="rgba(255,255,255,0.08)"/>
  
  <!-- Lightning bolt (speed/quick symbol) -->
  <g filter="url(#glow)">
    <path d="M370 65 L335 155 L365 155 L325 250 L395 140 L360 140 Z" fill="url(#gold)" opacity="0.95"/>
  </g>
  
  <!-- Bottom text: Q -->
  <text x="256" y="445" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="72" fill="white" letter-spacing="-2">
    QP
  </text>
  
  <!-- Accent dot -->
  <circle cx="310" cy="425" r="6" fill="#E8A735"/>
</svg>
